# nfpm config: builds the .deb and .rpm for a single architecture from a
# pre-built static musl binary. One config, both formats.
#
# The workflow (.github/workflows/release.yml) sets these env vars per matrix
# leg; nfpm expands ${VAR} from the environment for the metadata fields below:
#   VERSION    package version, e.g. 0.1.0 (no leading "v")
#   NFPM_ARCH  nfpm arch: amd64 | arm64 | arm7 (mapped to deb/rpm arch names)
#
# nfpm does NOT expand the `contents.src` path, so the workflow stages the built
# binary to ./dist/pkg/vtk6800 (the literal path referenced below) first.
#
# Invoke once per format:
#   nfpm package -f packaging/nfpm.yaml --packager deb --target dist/
#   nfpm package -f packaging/nfpm.yaml --packager rpm --target dist/
name: vtk6800
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: "Diego Fernando Carrión <diego@crthaze.com>"
description: |
  Configuration tool for the Vortex PC66/PC68 (VTK-6800) mechanical keyboard.
  Remap keys across the base and Fn layers, manage macros, and inspect the
  layout from the command line, talking to the keyboard directly over hidraw.
vendor: "CRThaze"
homepage: "https://github.com/CRThaze/vtk6800"
license: MIT

# Statically linked (musl): no shared-library dependencies, so the packages
# deliberately declare none.

contents:
  # The workflow stages the freshly-built binary here before packaging. nfpm
  # does not env-expand `src`, so this path is literal (it does expand `arch`
  # and `version` above).
  - src: ./dist/pkg/vtk6800
    dst: /usr/bin/vtk6800
    file_info:
      mode: 0755

  # Grants the logged-in user rw on the keyboard's hidraw nodes via uaccess, so
  # the tool works without root or a manual `vtk6800 udev install`.
  - src: ./packaging/udev/70-vortex-pc68.rules
    dst: /usr/lib/udev/rules.d/70-vortex-pc68.rules
    file_info:
      mode: 0644

  - src: ./LICENSE
    dst: /usr/share/doc/vtk6800/LICENSE
    file_info:
      mode: 0644

  - src: ./README.md
    dst: /usr/share/doc/vtk6800/README.md
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/nfpm/reload-udev.sh
  postremove: ./packaging/nfpm/reload-udev.sh
