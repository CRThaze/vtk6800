# PC68 / VTK-6800: base-layer default keymap (factory)
# Auto-generated from Vortex GUi KeyboardLayout.xml. Do not hand-edit;
# re-run gen_base_layer.py. Fn-layer defaults live in fn_layer_default.toml.

[meta]
model = "PC68 / VTK-6800 (hfd.cn HFD801)"
variant = "ANSI 68-key"   # ISO differs: 69 keys, drops slot 67 (0x31),
#                           adds slot 110 (0x32) + slot 111 (0x64 non-US)
layer = "base"
write_command = 0x11   # 04 11 09 : program base keymap (see PROTOCOL.md)
source = "KeyboardLayout.xml (Vortex GUi PC66 V1.6)"
generated = "2026-07-16"
key_count = 68

# slot = hardware key_index (== light_index here). hid = USB HID usage id.
# Default entry the tool emits per key: [0x02, 0x00, hid, 0x00] (standard key),
# except the Fn key which is a layer-hold (entry type 0x05, hid 0xAF is an
# internal marker, NOT a real HID usage).

