# FIRMWARE-RESERVED ON THE FN LAYER (hardware-verified 2026-07-27):
# The wireless module (HFD801) hardwires the arrow keys, the right-edge column,
# and the bottom-LEFT modifier cluster to its radio / OS-switch functions (BT
# device switch 1/2/3, 2.4G, pairing, USB<->wireless toggle, battery). Note this
# is not one contiguous block: it is the arrow+right-edge cluster PLUS the
# bottom-left mods. The firmware intercepts these
# Fn combos BEFORE consulting the Fn keymap, so any value flashed here emits
# NOTHING to USB. This was confirmed two ways: evtest shows no event for these
# Fn combos, and the VENDOR's own Windows GUI also has no effect when remapping
# them. An earlier note here claimed they were "fully user-remappable (verified
# against a vendor GUI profile export)" -- that was WRONG: the GUI *accepts* the
# assignment into the profile, but the hardware does not honor it at runtime.
# Reserved slots and their canonical firmware function (per the official manuals
# -- "Connection", "Fn Key Combos", and "RGB Light Setting" panels; RGB combos
# need the RGB variant in wired mode). These carry no Fn keyboard output and MUST
# NOT be treated as remappable -- pick another slot instead. Mirrored in
# crates/core/src/reserved.rs.
#   slot 117 Home     -> Bluetooth pairing mode (Fn+Home)
#   slot 118 PgUp     -> Bluetooth device 1
#   slot 121 PgDn     -> Bluetooth device 2
#   slot 120 End      -> Bluetooth device 3
#   slot 101 Up       -> RGB brightness up
#   slot 100 Down     -> RGB brightness down
#   slot 102 Right    -> RGB effect speed up
#   slot 99  Left     -> RGB effect speed down
#   slot 92  LWin     -> Win-lock (disable Win key)
#   slot 91  LCtrl    -> switch RGB colour
#   slot 93  LAlt     -> switch RGB lighting mode
# Separately, held ~2-3s WITHOUT Fn (base-layer chords, not Fn entries): Alt_L/R +
# PgUp/PgDn/End = Colemak/Dvorak/Qwerty, Alt_L/R + Home = OS switch, Alt_L+Alt_R =
# factory reset. These are why the vendor tracks `keyboard_layout` as a hardware
# combo (PROTOCOL.md 7d) rather than a wire command.
#
# The three keys below are in the MAIN cluster (Z, ., /), OUTSIDE the reserved
# zone, so per the manual's Fn-combo box they are ordinary remappable outputs:
# Fn+Z = Menu, Fn+. = Right Win, Fn+/ = Win (68-key).
[[key]]
slot = 74
base = "Z"
fn_action = "Menu"
class = "key"
code = 0x65

[[key]]
slot = 82
base = ">"
fn_action = "Right Win"
class = "key"
code = 0xe7

[[key]]
slot = 83
base = "?"
fn_action = "Win"
class = "key"
code = 0xe3
